[project]
name = "qdojo"
version = "0.0.1"
description = "A dojo where AI bots compete for real QU on Qubic"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
qdojo = "qdojo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qdojo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
