<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QDOJO — cockpit</title>
<!-- No web font: this page must work with no network at all, and a font
     request would carry the token in a Referer. style.css falls back to
     Courier, which is fine; the colours and boxes carry the look. -->
<link rel="stylesheet" href="style.css">
<style>
  /* The cockpit's own few rules. Inline is allowed by the CSP (style-src
     'unsafe-inline'); a second stylesheet would be a fifth literal route. */
  .cockpit { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); align-items: start; }
  .cockpit > .wide { grid-column: 1 / -1; }
  .cockpit .panel { margin-bottom: 0; }
  .stat .v.state-running { color: var(--green); }
  .stat .v.state-stale { color: var(--red); animation: blink 1.1s steps(1) infinite; }
  .stat .v.state-idle { color: var(--grey); }
  .actions { font-family: var(--font-text); font-size: 11px; line-height: 1.6; color: var(--green); background: var(--black); border: 3px solid var(--blue); padding: 8px 10px; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .actions.log { color: var(--grey); max-height: 260px; overflow: auto; }
  .spark { display: block; width: 100%; height: 90px; background: var(--black); border: 3px solid var(--blue); margin-bottom: 20px; }
  .spark polyline { fill: none; stroke-width: 2; vector-effect: non-scaling-stroke; }
  .spark line { stroke: var(--navy-2); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .sform td { white-space: normal; vertical-align: top; }
  .sform .s-key b { display: block; font-size: 9px; color: var(--white); }
  .sform .s-key code { font-family: var(--font-text); font-size: 10px; color: var(--cyan); }
  .sform input, .sform select {
    font-family: var(--font-text); font-size: 12px; color: var(--green); background: var(--black);
    border: 3px solid var(--green); padding: 6px 8px; width: 100%; min-width: 160px; box-sizing: border-box;
  }
  .sform input:disabled, .sform select:disabled { border-color: var(--grey); color: var(--grey); }
  .sform .s-help { max-width: 34ch; color: var(--grey); }
  .sform .s-act { white-space: nowrap; }
  .sform .s-msg { display: block; margin-top: 6px; font-size: 8px; }
  .sform .secret-state { display: inline-block; margin-top: 6px; font-size: 8px; }
</style>
</head>
<body class="crt-on">
<div class="crt" aria-hidden="true"></div>

<header class="hud">
  <a class="hud-logo" href="/">Q<span>DOJO</span></a>
  <div class="hud-status"><span class="pill pill-live">YOUR MACHINE</span> <span id="hud-bot" class="pill"></span></div>
  <nav class="hud-nav"><a class="on" href="#">COCKPIT</a></nav>
</header>

<main id="main" style="padding:var(--gutter)">
  <div id="body"><div class="panel"><h3>OPENING THE DOJO…</h3></div></div>
</main>

<footer class="foot">
  <div class="foot-left">127.0.0.1 ONLY &middot; NOTHING HERE LEAVES THIS MACHINE</div>
</footer>

<script src="avatars.js"></script>
<script src="dash.js"></script>
</body>
</html>
