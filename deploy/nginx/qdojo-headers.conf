# Security headers for every QDOJO response (included per location; see
# default.conf.template). The CSP allows only this origin, Google Fonts, the
# data: SVG icons the stylesheets use, and the one inline script of
# combat.html (its hash; recompute it if that line changes:
#   printf %s "<script body>" | openssl dgst -sha256 -binary | base64).
# style-src needs 'unsafe-inline' for the style="" attributes the views write
# (bar widths); no script is inline except the hashed one.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-/FsDuutKKVv/RDoNb6j7TLProoMeJZ2WrVIg7J8JxxM='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
